<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Admin | Blind Spidy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050405;--tx:#fff;--tx2:#b7b7b7;--mut:#8d8d8d;--red:#ff102b;--red2:#c90024;--line:rgba(255,255,255,.1);--redline:rgba(255,16,43,.4)}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 480px at 90% -8%,rgba(255,16,43,.22),transparent 62%),radial-gradient(700px 480px at -8% 108%,rgba(255,16,43,.13),transparent 62%)}
a{color:inherit}.mark{font:italic 900 22px Montserrat,sans-serif;letter-spacing:-.03em;text-transform:uppercase;text-decoration:none}.mark b{color:var(--red)}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;position:relative}
#nav{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;background:rgba(5,4,5,.72);backdrop-filter:blur(10px);overflow:auto}
#nav .mark{margin:0 0 16px 8px}
#nav a.n{display:block;padding:11px 14px;border-radius:12px;color:#d6d6d6;text-decoration:none;font-weight:500;border:1px solid transparent}
#nav a.n:hover{background:rgba(255,255,255,.05)}#nav a.n.on{border-color:var(--redline);background:rgba(255,16,43,.13);color:#fff}
#nav .sp{flex:1}
#v{padding:30px 34px 80px;max-width:1180px;width:100%}
h1{font:italic 800 34px Montserrat,sans-serif;margin:0 0 4px;letter-spacing:-.02em}h1 s{text-decoration:none;color:var(--red)}
.lead{color:var(--tx2);margin:0 0 22px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:30px 0 12px}
.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat small{color:var(--mut);display:block}.stat b{font-size:26px;font-weight:700}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;color:#fff;font:inherit}
textarea{min-height:76px;resize:vertical}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2712%27%20height=%278%27%20fill=%27none%27%20stroke=%27%23ffffff%27%20stroke-width=%272%27%3E%3Cpath%20d=%27M1%201l5%205%205-5%27/%3E%3C/svg%3E);background-repeat:no-repeat;background-position:right 12px center}
option{background:#111}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(255,16,43,.18)}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--red);vertical-align:-4px;margin-right:8px}
input[type=file]{padding:8px}
.cb{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 14px}.cb label{display:flex;align-items:center;cursor:pointer}
.b{background:linear-gradient(135deg,#ff2a42,#d1001f);border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter,sans-serif;color:#fff;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.b:hover{filter:brightness(1.1)}.b:disabled{opacity:.55}.b.s{background:rgba(255,255,255,.07);border:1px solid var(--line)}.b.d{background:transparent;border:1px solid #7a2630;color:#ff8a98}.b.sm{padding:5px 12px;min-height:34px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.row .t{min-width:0;flex:1}.row small,.mut{color:var(--mut)}.row small{display:block}
.thumb{width:64px;height:48px;border-radius:8px;background:#1a1214 center/cover no-repeat;flex:none;border:1px solid var(--line)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--tx2)}.badge.ok{color:#4be08a;border-color:rgba(75,224,138,.4)}.badge.wa{color:#ffb020;border-color:rgba(255,176,32,.4)}.badge.er{color:#ff7a89;border-color:rgba(255,122,137,.4)}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;color:var(--mut)}
details.row{display:block}details summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}details[open] summary{margin-bottom:10px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.diff{width:100%;border-collapse:collapse;font-size:13px}.diff td,.diff th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;word-break:break-word}.diff th{color:var(--mut);font-weight:500}
.slot{border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;min-height:90px;display:grid;place-items:center}.slot img,.slot video{max-width:100%;max-height:90px;border-radius:8px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.mo.on{display:flex}
.md{width:min(560px,100%);max-height:94vh;overflow:auto;background:#120a0c;border:1px solid var(--redline);border-radius:18px;padding:20px}
.crop{position:relative;margin:12px auto;border-radius:12px;overflow:hidden;background:#000;touch-action:none;cursor:grab;border:1px solid var(--line)}.crop canvas{display:block;width:100%;height:100%}
.crop::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px) 0 33.3%/100% 33.3%,linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px) 33.3% 0/33.3% 100%;opacity:.5}
.prev{display:flex;gap:12px;align-items:center;margin:10px 0;color:var(--mut);font-size:13px}.prev canvas{border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#1a1214;border:1px solid var(--red);padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:99;max-width:90vw;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
@media(max-width:900px){#app{grid-template-columns:1fr}#nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}#nav a.n{white-space:nowrap;padding:9px 14px}#nav .sp,#nav .mark{display:none}#v{padding:18px 14px 70px}.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div><div class="mo" id="mo"><div class="md" id="md"></div></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://mnwajosoystfikvhjdyf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ud2Fqb3NveXN0ZmlrdmhqZHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MTg4NjYsImV4cCI6MjExMDk5NDg2Nn0.eHwS2FfGka3-yR3cnczAHo5jPx0WO4t8YUDtjW2Uiyg');
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const H=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'\u20b9'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const dt=i=>i?new Date(i).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const day=i=>i?new Date(i).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'-';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)};
const opts=(a,sel)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${H(v)}" ${v==sel?'selected':''}>${H(l)}</option>`}).join('');

const friendly=m=>/ad_campaigns_check/.test(m)?'The end date must be after the start date.':/overlap|exclusion|conflict/i.test(m)?'That slot already has an active campaign in this period.':m;
async function run(q,ok){const{error}=await q;if(error){toast(friendly(error.message));return false}toast(ok||'Saved');return true}
async function token(){const{data:{session}}=await sb.auth.getSession();return session&&session.access_token}
async function api(path,body){const t=await token();const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({error:'No response from the server'}));return{ok:r.ok,j}}
const SL={1:{n:'Slot 1 - wide banner',r:2.75,w:2200,s:'2200 x 800 px (11:4)'},2:{n:'Slot 2 - card',r:4/3,w:1200,s:'1200 x 900 px (4:3)'},3:{n:'Slot 3 - card',r:4/3,w:1200,s:'1200 x 900 px (4:3)'}};
/* ---------------- modal + cropper ---------------- */
const mo=$('#mo'),md=$('#md');const closeMo=()=>{mo.classList.remove('on');md.innerHTML=''};
mo.addEventListener('click',e=>{if(e.target===mo&&!md.querySelector('.crop'))closeMo()});
function cropImage(file,ratio,outW,title){return new Promise(res=>{
 const img=new Image();img.onerror=()=>{toast('Could not read that image.');res(null)};
 img.onload=()=>{const vw=Math.min(480,innerWidth-70),vh=Math.round(vw/ratio);let s0=Math.max(vw/img.width,vh/img.height),s=s0,x=(vw-img.width*s)/2,y=(vh-img.height*s)/2;
  md.innerHTML=`<h3 style="margin:0 0 4px">${H(title||'Crop image')}</h3><div class="mut">Drag to move. Pinch, scroll or use the slider to zoom.</div><div class="crop" id="cr" style="width:${vw}px;height:${vh}px"><canvas id="cv" width="${vw}" height="${vh}"></canvas></div>
  <label class="f"><span>Zoom</span><input id="zm" type="range" min="1" max="4" step="0.01" value="1"></label>
  <div class="prev"><canvas id="pv" width="${Math.round(110*Math.min(ratio,2))}" height="${Math.round(110*Math.min(ratio,2)/ratio)}"></canvas><span>Preview of the final crop (${outW} x ${Math.round(outW/ratio)} px)</span></div>
  <div class="acts"><button class="b" id="cok">Use this crop</button><button class="b s" id="crs">Reset</button><button class="b s" id="cno">Cancel</button></div>`;
  mo.classList.add('on');const cv=$('#cv'),c=cv.getContext('2d'),pv=$('#pv'),pc=pv.getContext('2d');
  const clamp=()=>{x=Math.min(0,Math.max(vw-img.width*s,x));y=Math.min(0,Math.max(vh-img.height*s,y))};
  const draw=()=>{clamp();c.fillStyle='#000';c.fillRect(0,0,vw,vh);c.drawImage(img,x,y,img.width*s,img.height*s);pc.drawImage(cv,0,0,pv.width,pv.height);$('#zm').value=s/s0};
  const zoom=(ns,cx,cy)=>{ns=Math.min(s0*4,Math.max(s0,ns));const px=(cx-x)/s,py=(cy-y)/s;s=ns;x=cx-px*s;y=cy-py*s;draw()};
  const ptr=new Map();let last=0;const cr=$('#cr');
  cr.onpointerdown=e=>{cr.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);last=0;cr.style.cursor='grabbing'};
  cr.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
   if(ptr.size==2){ptr.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(last)zoom(s*d/last,vw/2,vh/2);last=d;return}
   x+=e.clientX-p[0];y+=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);draw()};
  cr.onpointerup=cr.onpointercancel=e=>{ptr.delete(e.pointerId);last=0;cr.style.cursor='grab'};
  cr.onwheel=e=>{e.preventDefault();zoom(s*(e.deltaY<0?1.08:1/1.08),e.offsetX,e.offsetY)};
  $('#zm').oninput=e=>zoom(s0*e.target.value,vw/2,vh/2);
  $('#crs').onclick=()=>{s=s0;x=(vw-img.width*s)/2;y=(vh-img.height*s)/2;draw()};
  $('#cno').onclick=()=>{closeMo();res(null)};
  $('#cok').onclick=()=>{const k=outW/vw,o=document.createElement('canvas');o.width=outW;o.height=Math.round(outW/ratio);o.getContext('2d').drawImage(img,x*k,y*k,img.width*s*k,img.height*s*k);o.toBlob(b=>{closeMo();res(b)},'image/jpeg',.9)};
  draw()};
 img.src=URL.createObjectURL(file)})}
async function uploadBlob(blob,folder,bucket,type){const p=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${type=='image/png'?'png':type=='video/mp4'?'mp4':type=='video/webm'?'webm':'jpg'}`;const u=await sb.storage.from(bucket||'thumbnails').upload(p,blob,{contentType:type||'image/jpeg'});if(u.error){toast(u.error.message);return null}return sb.storage.from(bucket||'thumbnails').getPublicUrl(p).data.publicUrl}
/* file picker -> cropped image url (kept until the form is saved) */
let PENDING={};
function picker(key,ratio,outW,title){return `<div class="grid" style="grid-template-columns:auto 1fr;align-items:center"><div class="thumb" id="pv-${key}" style="width:96px;height:${Math.round(96/ratio)}px"></div><div><input type="file" id="fi-${key}" accept="image/png,image/jpeg,image/webp" data-r="${ratio}" data-w="${outW}" data-t="${H(title)}"><div class="mut" style="margin-top:4px" id="ft-${key}">Choose a picture, then drag and zoom to crop it.</div></div></div>`}
document.addEventListener('change',async e=>{const t=e.target;if(!t.id||!t.id.startsWith('fi-'))return;const key=t.id.slice(3),f=t.files[0];if(!f)return;
 if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>12e6){toast('Use a JPG, PNG or WebP image under 12 MB.');t.value='';return}
 const b=await cropImage(f,+t.dataset.r,+t.dataset.w,t.dataset.t);if(!b){t.value='';return}
 PENDING[key]=b;$('#pv-'+key).style.backgroundImage=`url(${URL.createObjectURL(b)})`;$('#ft-'+key).textContent='Cropped. It uploads when you save.'});
/* ---------------- shell ---------------- */
const NAV=[['dash','Dashboard'],['goals','Goals'],['don','Donations'],['ads','Advertising'],['links','Resources'],['assets','Assets'],['vid','Videos'],['msg','Messages'],['soc','Social'],['set','Settings'],['log','Audit log']];
const V={};let ME=null;
function shell(){$('#root').innerHTML=`<div id="app"><nav id="nav"><a class="mark" href="/">Blind <b>Spidy.</b></a>${NAV.map(([k,l])=>`<a class="n" href="#/${k}" data-k="${k}">${l}</a>`).join('')}<span class="sp"></span><a class="n" href="/">View website</a><a class="n" href="#" id="out">Log out</a></nav><main id="v"></main></div>`;
 $('#out').onclick=async e=>{e.preventDefault();await sb.auth.signOut();boot()}}
async function render(){const k=location.hash.slice(2).split('?')[0]||'dash';$$('#nav a.n').forEach(a=>a.classList.toggle('on',a.dataset.k==k));const v=$('#v');if(!v)return;v.innerHTML='<p class="mut">Loading...</p>';
 try{await (V[k]||V.dash)(v)}catch(e){console.error(e);v.innerHTML=`<p class="badge er">Something went wrong: ${H(e.message)}</p>`}}

async function boot(){const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#root').innerHTML=`<div class="login"><a class="mark" href="/" style="font-size:28px">Blind <b>Spidy.</b></a><h1 style="margin-top:18px">Admin <s>//</s></h1><p class="lead">Sign in to manage the site.</p><form id="lf" class="card">${fld('Email','<input name="e" type="email" required autocomplete="username">')}${fld('Password','<input name="p" type="password" required autocomplete="current-password">')}<button class="b" style="width:100%">Sign in</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:d.get('e'),password:d.get('p')});error?toast(error.message):boot()};return}
 const{data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
 if(!p||p.role!='admin'){$('#root').innerHTML=`<div class="login"><h1>No access</h1><p class="lead">This account is not an admin.</p><button class="b" id="so">Sign out</button></div>`;$('#so').onclick=async()=>{await sb.auth.signOut();boot()};return}

const cnt=t=>sb.from(t).select('*',{count:'exact',head:true});
/* ---------------- dashboard ---------------- */
V.dash=async el=>{const since=new Date(Date.now()-30*864e5).toISOString();
 const[R,Vd,M,S,T,TC,D]=await Promise.all([cnt('resources'),cnt('videos'),sb.from('contact_messages').select('*',{count:'exact',head:true}).eq('is_read',false).eq('is_spam',false),sb.from('social_stats').select('*'),sb.from('site_visits').select('visited_at').gte('visited_at',since).limit(5000),cnt('site_visits'),sb.from('donations').select('confirmed_amount').eq('payment_status','success')]);
 const ss=Object.fromEntries((S.data||[]).map(x=>[x.platform,x])),raised=(D.data||[]).reduce((a,x)=>a+Number(x.confirmed_amount||0),0);
 const days=[...Array(30)].map((_,i)=>new Date(Date.now()-(29-i)*864e5).toISOString().slice(0,10)),c={};days.forEach(d=>c[d]=0);(T.data||[]).forEach(x=>{const k=x.visited_at.slice(0,10);if(k in c)c[k]++});
 const ys=days.map(d=>c[d]),mx=Math.max(...ys,1),line=ys.map((y,i)=>(i?'L':'M')+(i*600/29).toFixed(1)+' '+(160-y/mx*140).toFixed(1)).join('');
 const sync=(p,n)=>{const s=ss[p];return `<div class="row"><div class="t">${n}<small>${s&&s.last_synced_at?'Updated '+dt(s.last_synced_at):'Never updated'}</small></div><span class="badge ${s&&s.status=='synced'?'ok':s&&s.status=='error'?'er':'wa'}">${s?(s.status=='synced'?'Synced':s.status=='error'?'Error':s.manual?'Manual':'Pending'):'Pending'}</span></div>`};
 el.innerHTML=`<h1>Dashboard <s>//</s></h1><p class="lead">A quick look at your site.</p>
 <div class="grid g4"><div class="card stat"><small>Website visits</small><b>${(TC.count||0).toLocaleString()}</b></div><div class="card stat"><small>Verified donations</small><b>${money(raised)}</b></div><div class="card stat"><small>YouTube subscribers</small><b>${Number((ss.youtube||{}).count||0).toLocaleString()}</b></div><div class="card stat"><small>Instagram followers</small><b>${Number((ss.instagram||{}).count||0).toLocaleString()}</b></div></div>
 <div class="grid g4" style="margin-top:14px"><div class="card stat"><small>Resources and assets</small><b>${R.count||0}</b></div><div class="card stat"><small>Videos, shorts, reels</small><b>${Vd.count||0}</b></div><div class="card stat"><small>Unread messages</small><b>${M.count||0}</b></div><div class="card stat"><small>Busiest day (30 days)</small><b>${mx>1||ys.some(Boolean)?mx:0}</b></div></div>
 <div class="grid g2" style="margin-top:14px;grid-template-columns:2fr 1fr"><div class="card"><b>Traffic, last 30 days</b><svg viewBox="0 0 600 180" style="width:100%;margin-top:8px"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF102B" stop-opacity=".45"/><stop offset="1" stop-color="#FF102B" stop-opacity="0"/></linearGradient></defs><path d="${line}L600 160L0 160Z" fill="url(#gr)"/><path d="${line}" fill="none" stroke="#FF102B" stroke-width="2"/><text x="0" y="176" fill="#8d8d8d" font-size="11">${days[0].slice(5)}</text><text x="600" y="176" fill="#8d8d8d" font-size="11" text-anchor="end">${days[29].slice(5)}</text></svg></div>
 <div class="card"><b>Sync status</b>${sync('youtube','YouTube')}${sync('instagram','Instagram')}<div class="acts" style="margin-top:12px"><button class="b sm" id="sy">Sync YouTube</button><button class="b sm s" id="si">Sync Instagram</button></div></div></div>`;
 $('#sy').onclick=async e=>{e.target.disabled=true;toast('Syncing YouTube...');const r=await api('/api/sync-youtube',{});toast(r.ok?`YouTube synced: ${r.j.videos} videos`:(r.j.error||'Sync failed'));e.target.disabled=false;render()};
 $('#si').onclick=async e=>{e.target.disabled=true;toast('Syncing Instagram...');const r=await api('/api/sync-instagram',{});toast(r.ok?`Instagram synced: ${r.j.reels} reels`:(r.j.error||'Sync failed'));e.target.disabled=false;render()}};

const DS={status:'all',goal:'all',from:'',to:'',q:'',page:0},PG=50;
function donQuery(count){let q=sb.from('donations').select('*,donors(private_name,normalized_email),fundraising_goals(title)',count?{count:'exact'}:undefined).order('created_at',{ascending:false});
 if(DS.status!='all')q=q.eq('payment_status',DS.status);if(DS.goal!='all')q=q.eq('goal_id',DS.goal);
 if(DS.from)q=q.gte('created_at',new Date(DS.from+'T00:00:00').toISOString());if(DS.to)q=q.lte('created_at',new Date(DS.to+'T23:59:59').toISOString());
 const s=DS.q.replace(/[,()%*]/g,'').trim();if(s)q=q.or(`famgateway_order_id.ilike.%${s}%,reference.ilike.%${s}%,utr.ilike.%${s}%,transaction_id.ilike.%${s}%`);return q}
V.don=async el=>{const[G,res]=await Promise.all([sb.from('fundraising_goals').select('id,title').order('display_order'),donQuery(true).range(DS.page*PG,DS.page*PG+PG-1)]);const rows=res.data||[],total=res.count||0;
 el.innerHTML=`<h1>Donations <s>//</s></h1><p class="lead">Every payment, with filters and export.</p>
 <form id="df" class="card"><div class="grid g4">${fld('Status',`<select name="status">${opts([['all','All'],['success','Successful'],['pending','Pending'],['expired','Expired'],['failed','Failed']],DS.status)}</select>`)}${fld('Goal',`<select name="goal">${opts([['all','All goals'],...(G.data||[]).map(x=>[x.id,x.title])],DS.goal)}</select>`)}${fld('From',`<input type="date" name="from" value="${DS.from}">`)}${fld('To',`<input type="date" name="to" value="${DS.to}">`)}</div>
 ${fld('Search by order id, reference, UTR or transaction id',`<input name="q" value="${H(DS.q)}" placeholder="e.g. fg_ABC123">`)}<div class="acts"><button class="b">Apply filters</button><button type="button" class="b s" id="dr">Reset</button><button type="button" class="b s" id="dx">Export CSV (${total})</button></div></form>
 <h3>${total} donation${total==1?'':'s'}</h3><div class="card">${rows.map(x=>`<div class="row"><div class="t"><b>${money(x.confirmed_amount||x.requested_amount)}</b> &middot; ${H(x.donors&&x.donors.private_name)} <span class="badge ${x.payment_status=='success'?'ok':x.payment_status=='pending'?'wa':'er'}">${x.payment_status}</span><small>${H(x.donors&&x.donors.normalized_email)} &middot; ${H(x.fundraising_goals&&x.fundraising_goals.title)}</small><small>Order ${H(x.famgateway_order_id||'-')} &middot; Ref ${H(x.reference)} &middot; UTR ${H(x.utr||'-')} &middot; Txn ${H(x.transaction_id||'-')}</small></div><span class="mut">${dt(x.created_at)}</span></div>`).join('')||'<p class="mut">No donations match.</p>'}</div>
 <div class="pager"><button class="b sm s" id="pp" ${DS.page?'':'disabled'}>Previous</button><span>Page ${DS.page+1} of ${Math.max(1,Math.ceil(total/PG))}</span><button class="b sm s" id="pn" ${(DS.page+1)*PG>=total?'disabled':''}>Next</button></div>`;
 $('#df').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(DS,{status:f.get('status'),goal:f.get('goal'),from:f.get('from'),to:f.get('to'),q:f.get('q'),page:0});render()};
 $('#dr').onclick=()=>{Object.assign(DS,{status:'all',goal:'all',from:'',to:'',q:'',page:0});render()};
 $('#pp').onclick=()=>{DS.page--;render()};$('#pn').onclick=()=>{DS.page++;render()};
 $('#dx').onclick=async e=>{e.target.disabled=true;toast('Preparing CSV...');let all=[],p=0;for(;;){const r=await donQuery(false).range(p*1000,p*1000+999);if(r.error){toast(r.error.message);break}all=all.concat(r.data||[]);if(!r.data||r.data.length<1000)break;p++}
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;const head=['Date','Donor name','Donor email','Goal','Requested (INR)','Confirmed (INR)','Status','Order ID','Reference','UTR','Transaction ID'];
  const csv='\ufeff'+[head.map(esc).join(',')].concat(all.map(x=>[x.created_at,x.donors&&x.donors.private_name,x.donors&&x.donors.normalized_email,x.fundraising_goals&&x.fundraising_goals.title,x.requested_amount,x.confirmed_amount,x.payment_status,x.famgateway_order_id,x.reference,x.utr,x.transaction_id].map(esc).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`donations-${new Date().toISOString().slice(0,10)}.csv`;document.body.append(a);a.click();a.remove();toast(`Exported ${all.length} rows`);e.target.disabled=false}};

 <h3>Library (${(data||[]).length})</h3><div class="card">${(data||[]).map(x=>`<div class="row"><div class="thumb" style="${x.thumbnail_url?`background-image:url(${H(x.thumbnail_url)})`:''}"></div><div class="t"><b>${H(x.title)}</b><small>${x.platform} &middot; ${x.kind} &middot; ${Number(x.view_count).toLocaleString()} views &middot; ${x.manual?'manual':'synced'}${x.visible?'':' &middot; hidden'}</small></div><div class="acts"><button class="b sm s" data-a="vis" data-id="${x.id}" data-v="${x.visible}">${x.visible?'Hide':'Show'}</button><button class="b sm d" data-a="del" data-id="${x.id}">Delete</button></div></div>`).join('')||'<p class="mut">Nothing yet. Run a sync.</p>'}</div>`;
 $('#sy').onclick=async e=>{e.target.disabled=true;toast('Syncing YouTube...');const r=await api('/api/sync-youtube',{});toast(r.ok?`YouTube synced: ${r.j.videos} videos`:(r.j.error||'Sync failed'));e.target.disabled=false;render()};
 $('#si').onclick=async e=>{e.target.disabled=true;toast('Syncing Instagram...');const r=await api('/api/sync-instagram',{});toast(r.ok?`Instagram synced: ${r.j.reels} reels`:(r.j.error||'Sync failed'));e.target.disabled=false;render()};
 $('#fv').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);if(await run(sb.from('videos').insert({platform:f.get('platform'),kind:f.get('kind'),title:f.get('title'),url:f.get('url'),duration:f.get('dur')||null,thumbnail_url:f.get('thumb')||null,view_count:+f.get('views')||0,manual:true}),'Added'))render()};
 el.onclick=async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;
  if(b.dataset.a=='vis'&&await run(sb.from('videos').update({visible:b.dataset.v!='true'}).eq('id',id)))render();
  if(b.dataset.a=='del'&&confirm('Delete this video from your site?')&&await run(sb.from('videos').delete().eq('id',id),'Deleted'))render()}};
/* ---------------- messages ---------------- */
V.msg=async el=>{const{data}=await sb.from('contact_messages').select('*').order('created_at',{ascending:false}).limit(200);
 el.innerHTML=`<h1>Messages <s>//</s></h1><p class="lead">From your contact form.</p><div class="card">${(data||[]).map(x=>`<div class="row" style="${x.is_read?'opacity:.6':''}"><div class="t"><b>${H(x.name)}</b> &middot; <a href="mailto:${H(x.email)}">${H(x.email)}</a> ${x.is_spam?'<span class="badge er">spam</span>':''}<small>${dt(x.created_at)}</small><pre>${H(x.message)}</pre></div><div class="acts"><button class="b sm s" data-a="rd" data-id="${x.id}" data-v="${x.is_read}">${x.is_read?'Mark unread':'Mark read'}</button><button class="b sm s" data-a="sp" data-id="${x.id}" data-v="${x.is_spam}">${x.is_spam?'Not spam':'Spam'}</button><button class="b sm d" data-a="del" data-id="${x.id}">Delete</button></div></div>`).join('')||'<p class="mut">No messages yet.</p>'}</div>`;
 el.onclick=async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id,fl=b.dataset.v!='true';let q;
  if(b.dataset.a=='rd')q=sb.from('contact_messages').update({is_read:fl}).eq('id',id);if(b.dataset.a=='sp')q=sb.from('contact_messages').update({is_spam:fl}).eq('id',id);
  if(b.dataset.a=='del'){if(!confirm('Delete this message?'))return;q=sb.from('contact_messages').delete().eq('id',id)}if(q&&await run(q))render()}};
/* ---------------- social ---------------- */
V.soc=async el=>{const{data}=await sb.from('social_stats').select('*');const ss=Object.fromEntries((data||[]).map(x=>[x.platform,x]));
 const st=p=>{const s=ss[p];return s?`${s.status=='synced'?'Synced':s.status=='error'?'Sync error':s.manual?'Manual':'Pending'}${s.last_synced_at?' &middot; '+dt(s.last_synced_at):''}`:'Pending'};
 el.innerHTML=`<h1>Social <s>//</s></h1><p class="lead">Counts on the homepage progress cards.</p>
 <div class="grid g2"><form id="fs" class="card"><b>Set counts by hand</b><div class="mut" style="margin-bottom:10px">Only needed when a sync is not connected.</div>${fld('YouTube subscribers',`<input name="yt" type="number" min="0" value="${(ss.youtube||{}).count||0}">`)}${fld('Instagram followers',`<input name="ig" type="number" min="0" value="${(ss.instagram||{}).count||0}">`)}<button class="b">Save counts</button></form>
 <div class="card"><b>Status</b><div class="row"><div class="t">YouTube<small>${st('youtube')}</small></div><span class="badge ${(ss.youtube||{}).status=='synced'?'ok':'wa'}">API</span></div><div class="row"><div class="t">Instagram<small>${st('instagram')}</small></div><span class="badge ${(ss.instagram||{}).status=='synced'?'ok':'wa'}">API</span></div></div></div>
 <h3>Connect Instagram</h3><form id="fi" class="card"><p class="mut" style="margin-top:0">Needs an Instagram professional account and a Meta app with Instagram API (Instagram Login). In the Meta app dashboard, add your account, generate a long-lived access token and paste it here. It is stored privately on the server and renewed automatically.</p>${fld('Access token','<input name="t" type="password" autocomplete="off" required>')}<button class="b">Connect and sync</button></form>`;
 $('#fs').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);for(const[p,k]of[['youtube','yt'],['instagram','ig']]){const ok=await run(sb.from('social_stats').update({count:+f.get(k)||0,manual:true,status:'manual',last_synced_at:new Date().toISOString()}).eq('platform',p),'Saved');if(!ok)return}render()};
 $('#fi').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;toast('Connecting...');const r=await api('/api/sync-instagram',{token:new FormData(e.target).get('t')});b.disabled=false;toast(r.ok?`Connected as @${r.j.username||'account'}: ${r.j.reels} reels`:(r.j.error||'Could not connect'));if(r.ok)render()}};
/* ---------------- settings ---------------- */
V.set=async el=>{const{data}=await sb.from('site_settings').select('key,value');const s=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));
 el.innerHTML=`<h1>Settings <s>//</s></h1><p class="lead">Donation limits and a health check.</p><form id="fs" class="card"><div class="grid g2">${fld('Minimum amount (INR)',`<input name="min" type="number" min="1" value="${s.donation_min||10}">`)}${fld('Maximum amount (INR)',`<input name="max" type="number" min="1" value="${s.donation_max||10000}">`)}</div>${fld('Suggested amounts (comma separated)',`<input name="amts" value="${(s.donation_amounts||[49,99,199,499]).join(', ')}">`)}${fld('Leaderboard rows on the homepage',`<input name="lim" type="number" min="1" max="20" value="${s.leaderboard_limit||5}">`)}<button class="b">Save settings</button></form>
 <h3>Health check</h3><div class="card"><button class="b s" id="dg">Run payment and server check</button><pre id="dgo" style="display:none"></pre></div>`;
 $('#fs').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),am=String(f.get('amts')).split(',').map(x=>+x.trim()).filter(x=>x>0);if(await run(sb.from('site_settings').upsert([{key:'donation_min',value:+f.get('min')},{key:'donation_max',value:+f.get('max')},{key:'donation_amounts',value:am},{key:'leaderboard_limit',value:+f.get('lim')}])))render()};
 $('#dg').onclick=async e=>{e.target.disabled=true;const r=await api('/api/donate-diagnose');const o=$('#dgo');o.style.display='block';o.textContent=JSON.stringify(r.j,null,2);e.target.disabled=false}};
/* ---------------- audit log ---------------- */
const AL={q:'',from:'',to:'',admin:'all',entity:'all',action:'all',page:0},AP2=25;
V.log=async el=>{let q=sb.from('admin_audit_logs').select('*',{count:'exact'}).order('created_at',{ascending:false});
 if(AL.admin!='all')q=q.eq('admin_email',AL.admin);if(AL.entity!='all')q=q.eq('entity_type',AL.entity);if(AL.action!='all')q=q.eq('action',AL.action);
 if(AL.from)q=q.gte('created_at',new Date(AL.from+'T00:00:00').toISOString());if(AL.to)q=q.lte('created_at',new Date(AL.to+'T23:59:59').toISOString());
 const s=AL.q.replace(/[,()%*]/g,'').trim();if(s)q=q.or(`entity_type.ilike.%${s}%,admin_email.ilike.%${s}%,entity_id.ilike.%${s}%`);
 const[res,who]=await Promise.all([q.range(AL.page*AP2,AL.page*AP2+AP2-1),sb.from('admin_audit_logs').select('admin_email').limit(1000)]);
 const rows=res.data||[],total=res.count||0,admins=[...new Set((who.data||[]).map(x=>x.admin_email).filter(Boolean))],ents=['fundraising_goals','resources','videos','ad_campaigns','ad_enquiries','site_settings','donors','social_stats','contact_messages'];
 const diff=x=>{const keys=[...new Set([...Object.keys(x.old_values||{}),...Object.keys(x.new_values||{})])];return `<table class="diff"><tr><th>Field</th><th>Before</th><th>After</th></tr>${keys.map(k=>`<tr><td>${H(k)}</td><td>${H(JSON.stringify((x.old_values||{})[k]))}</td><td>${H(JSON.stringify((x.new_values||{})[k]))}</td></tr>`).join('')}</table>`};
 el.innerHTML=`<h1>Audit log <s>//</s></h1><p class="lead">Every change an admin makes. Entries cannot be edited or deleted.</p>
 <form id="lf" class="card"><div class="grid g4">${fld('Admin',`<select name="admin">${opts([['all','All admins'],...admins],AL.admin)}</select>`)}${fld('Area',`<select name="entity">${opts([['all','All areas'],...ents],AL.entity)}</select>`)}${fld('Action',`<select name="action">${opts([['all','All actions'],['INSERT','Created'],['UPDATE','Changed'],['DELETE','Deleted']],AL.action)}</select>`)}${fld('Search',`<input name="q" value="${H(AL.q)}" placeholder="admin, area or id">`)}</div><div class="grid g4">${fld('From',`<input type="date" name="from" value="${AL.from}">`)}${fld('To',`<input type="date" name="to" value="${AL.to}">`)}</div><div class="acts"><button class="b">Apply filters</button><button type="button" class="b s" id="lr">Reset</button></div></form>
 <h3>${total} entr${total==1?'y':'ies'}</h3><div class="card">${rows.map(x=>`<details class="row"><summary><span><span class="badge ${x.action=='DELETE'?'er':x.action=='INSERT'?'ok':'wa'}">${{INSERT:'Created',UPDATE:'Changed',DELETE:'Deleted'}[x.action]||x.action}</span> <b>${H(x.entity_type)}</b> <span class="mut">${H(String(x.entity_id||'').slice(0,12))}</span></span><span class="mut">${H(x.admin_email||'unknown')} &middot; ${dt(x.created_at)}</span></summary>${diff(x)}</details>`).join('')||'<p class="mut">No entries match.</p>'}</div>
 <div class="pager"><button class="b sm s" id="pp" ${AL.page?'':'disabled'}>Previous</button><span>Page ${AL.page+1} of ${Math.max(1,Math.ceil(total/AP2))}</span><button class="b sm s" id="pn" ${(AL.page+1)*AP2>=total?'disabled':''}>Next</button></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(AL,{admin:f.get('admin'),entity:f.get('entity'),action:f.get('action'),q:f.get('q'),from:f.get('from'),to:f.get('to'),page:0});render()};
 $('#lr').onclick=()=>{Object.assign(AL,{q:'',from:'',to:'',admin:'all',entity:'all',action:'all',page:0});render()};$('#pp').onclick=()=>{AL.page--;render()};$('#pn').onclick=()=>{AL.page++;render()}};
boot();
</script></body></html>
